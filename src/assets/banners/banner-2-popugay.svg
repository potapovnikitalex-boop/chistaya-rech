<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3ECDD"/>
      <stop offset="100%" stop-color="#E4EFEC"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F6E4C6"/>
      <stop offset="100%" stop-color="#F6E4C6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg2)"/>
  <circle cx="600" cy="260" r="260" fill="url(#halo)"/>

  <!-- decorative letters ring -->
  <g font-family="Georgia, serif" font-weight="700" fill="#C98A4B" opacity="0.5">
    <text x="150" y="140" font-size="40">Б</text>
    <text x="1000" y="150" font-size="34">Ш</text>
    <text x="120" y="420" font-size="30">Л</text>
    <text x="1030" y="400" font-size="42">Р</text>
    <text x="270" y="480" font-size="26">С</text>
    <text x="880" y="480" font-size="26">Ж</text>
  </g>

  <!-- sparkles -->
  <g fill="#D9A05B">
    <path d="M220,220 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z"/>
    <path d="M980,240 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
    <path d="M950,150 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z"/>
  </g>

  <!-- stack of books -->
  <g transform="translate(600,430)">
    <rect x="-120" y="-14" width="240" height="26" rx="4" fill="#5FA398"/>
    <rect x="-104" y="-36" width="208" height="24" rx="4" fill="#D9A05B"/>
    <rect x="-84" y="-56" width="168" height="22" rx="4" fill="#8FC1D9"/>
  </g>

  <!-- open book under parrot -->
  <g transform="translate(600,360)">
    <path d="M-100,0 C-55,-18 -15,-18 0,0 L0,44 C-15,26 -55,26 -100,44 Z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <path d="M100,0 C55,-18 15,-18 0,0 L0,44 C15,26 55,26 100,44 Z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <g stroke="#CFC3AC" stroke-width="2">
      <path d="M-80,10 L-20,-2"/>
      <path d="M-80,20 L-20,8"/>
      <path d="M-80,30 L-20,18"/>
      <path d="M80,10 L20,-2"/>
      <path d="M80,20 L20,8"/>
      <path d="M80,30 L20,18"/>
    </g>
  </g>

  <!-- ============= BIG PARROT MASCOT ============= -->
  <g transform="translate(600,240) scale(1.35)">
    <!-- tail -->
    <path d="M-10,60 C-60,90 -80,150 -66,200 C-42,150 -22,105 -6,68 Z" fill="#6E8F94"/>
    <path d="M4,60 C16,110 18,160 6,204 C-4,156 -6,105 -10,66 Z" fill="#87A8AC"/>
    <path d="M12,60 C34,96 42,140 28,182 C18,142 10,100 4,66 Z" fill="#9DB8BA"/>

    <!-- back wing -->
    <path d="M-30,-10 C-70,-6 -84,40 -50,66 C-56,32 -46,4 -20,-14 Z" fill="#6E8F94"/>

    <!-- body -->
    <ellipse cx="0" cy="8" rx="52" ry="62" fill="#93AFB1"/>
    <ellipse cx="0" cy="20" rx="32" ry="40" fill="#E4D7BA"/>
    <ellipse cx="0" cy="28" rx="22" ry="26" fill="#EFE6D2"/>

    <!-- front wing (holding a pointer/leaf) -->
    <path d="M28,-6 C64,2 70,46 36,66 C44,36 34,10 14,-8 Z" fill="#7D9C9F"/>
    <path d="M30,6 C50,14 54,38 36,50 C40,32 34,18 22,8 Z" fill="#5F7F82"/>

    <!-- head -->
    <circle cx="-4" cy="-56" r="42" fill="#9DB8BA"/>
    <!-- crest feathers -->
    <path d="M-24,-92 C-18,-110 -4,-114 2,-98" stroke="#C98A4B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-4,-96 C0,-116 16,-118 20,-100" stroke="#D9A05B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M14,-90 C20,-104 32,-104 34,-90" stroke="#C98A4B" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- cheek patch + eye -->
    <circle cx="-20" cy="-58" r="20" fill="#F4EEE0"/>
    <circle cx="-17" cy="-58" r="7" fill="#3B2A22"/>
    <circle cx="-14" cy="-61" r="2.4" fill="#ffffff"/>
    <path d="M-34,-72 q10,-8 20,-2" stroke="#7A6A55" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- beak -->
    <path d="M-36,-46 C-62,-42 -66,-24 -46,-14 C-50,-28 -44,-38 -26,-42 Z" fill="#D9A05B"/>
    <path d="M-42,-20 C-54,-16 -54,-6 -42,-2 C-46,-8 -46,-14 -36,-18 Z" fill="#B87A38"/>

    <!-- neck scarf: nod to speech-therapy "voice" theme -->
    <path d="M-30,-18 C-10,-6 20,-6 34,-20 C24,4 -20,4 -30,-18 Z" fill="#D97757"/>
  </g>

  <!-- speech bubble with a big letter, like the parrot is "teaching" -->
  <g transform="translate(820,110)">
    <path d="M0,20 a20,20 0 0 1 20,-20 h120 a20,20 0 0 1 20,20 v50 a20,20 0 0 1 -20,20 h-70 l-26,24 5,-24 h-29 a20,20 0 0 1 -20,-20 z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <text x="90" y="60" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#5FA398" text-anchor="middle">Рр</text>
  </g>

  <text x="600" y="500" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#3B2A22" text-anchor="middle">Твой помощник в мире звуков и букв</text>
</svg>
