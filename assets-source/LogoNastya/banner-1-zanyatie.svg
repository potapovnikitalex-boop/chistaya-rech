<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6EC"/>
      <stop offset="100%" stop-color="#EAF3F1"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FB8AE"/>
      <stop offset="100%" stop-color="#5FA398"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#sky)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="140" cy="90" rx="55" ry="22"/>
    <ellipse cx="185" cy="80" rx="40" ry="18"/>
    <ellipse cx="1040" cy="70" rx="60" ry="24"/>
    <ellipse cx="1090" cy="62" rx="35" ry="16"/>
  </g>

  <!-- floating letters -->
  <g font-family="Georgia, serif" font-weight="700" fill="#D9A05B" opacity="0.55">
    <text x="90" y="220" font-size="42">А</text>
    <text x="1060" y="180" font-size="38">Б</text>
    <text x="980" y="330" font-size="30">Р</text>
    <text x="60" y="330" font-size="28">С</text>
  </g>

  <!-- ground hill -->
  <path d="M0,420 C250,360 950,360 1200,430 L1200,520 L0,520 Z" fill="url(#hill)"/>
  <path d="M0,440 C300,400 900,400 1200,450 L1200,520 L0,520 Z" fill="#4F8F84" opacity="0.6"/>

  <!-- small table -->
  <rect x="500" y="380" width="200" height="14" rx="7" fill="#C98A4B"/>
  <rect x="520" y="394" width="14" height="60" fill="#B67640"/>
  <rect x="666" y="394" width="14" height="60" fill="#B67640"/>

  <!-- ==================== GIRL (left) ==================== -->
  <g transform="translate(300,240)">
    <!-- chair -->
    <rect x="-46" y="130" width="92" height="14" rx="7" fill="#E7C08A"/>
    <rect x="-32" y="144" width="12" height="50" fill="#D9A05B"/>
    <rect x="20" y="144" width="12" height="50" fill="#D9A05B"/>
    <!-- body -->
    <path d="M-40,70 C-40,40 40,40 40,70 L46,140 L-46,140 Z" fill="#F2A6A1"/>
    <!-- arms -->
    <path d="M-38,80 C-58,95 -58,120 -40,130" stroke="#F2A6A1" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M38,80 C58,95 58,120 40,130" stroke="#F2A6A1" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="0" cy="20" r="46" fill="#FCDCC0"/>
    <!-- hair -->
    <path d="M-46,10 C-52,-34 52,-34 46,10 C46,-6 30,-14 0,-16 C-30,-14 -46,-6 -46,10 Z" fill="#8A5A3B"/>
    <path d="M-46,10 C-50,40 -40,64 -30,70 C-40,50 -42,26 -38,10 Z" fill="#8A5A3B"/>
    <path d="M46,10 C50,40 40,64 30,70 C40,50 42,26 38,10 Z" fill="#8A5A3B"/>
    <!-- face -->
    <circle cx="-16" cy="18" r="5" fill="#3B2A22"/>
    <circle cx="16" cy="18" r="5" fill="#3B2A22"/>
    <path d="M-10,36 Q0,44 10,36" stroke="#B5654F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="30" r="7" fill="#F2A6A1" opacity="0.6"/>
    <circle cx="26" cy="30" r="7" fill="#F2A6A1" opacity="0.6"/>
  </g>

  <!-- open book in front of girl -->
  <g transform="translate(300,378)">
    <path d="M-50,0 C-30,-10 -10,-10 0,0 L0,26 C-10,16 -30,16 -50,26 Z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <path d="M50,0 C30,-10 10,-10 0,0 L0,26 C10,16 30,16 50,26 Z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <text x="-32" y="16" font-family="Georgia, serif" font-size="14" fill="#5FA398">Аа</text>
    <text x="14" y="16" font-family="Georgia, serif" font-size="14" fill="#D9A05B">Бб</text>
  </g>

  <!-- ==================== BOY (right) ==================== -->
  <g transform="translate(900,240)">
    <rect x="-46" y="130" width="92" height="14" rx="7" fill="#E7C08A"/>
    <rect x="-32" y="144" width="12" height="50" fill="#D9A05B"/>
    <rect x="20" y="144" width="12" height="50" fill="#D9A05B"/>
    <path d="M-40,70 C-40,40 40,40 40,70 L46,140 L-46,140 Z" fill="#8FC1D9"/>
    <path d="M-38,80 C-58,95 -58,120 -40,130" stroke="#8FC1D9" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M38,80 C58,95 58,120 40,130" stroke="#8FC1D9" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="46" fill="#F6D7B8"/>
    <path d="M-46,4 C-46,-30 46,-30 46,4 C30,-10 -30,-10 -46,4 Z" fill="#4A3A2C"/>
    <circle cx="-16" cy="18" r="5" fill="#3B2A22"/>
    <circle cx="16" cy="18" r="5" fill="#3B2A22"/>
    <path d="M-10,34 Q0,42 10,34" stroke="#B5654F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="30" r="7" fill="#8FC1D9" opacity="0.5"/>
    <circle cx="26" cy="30" r="7" fill="#8FC1D9" opacity="0.5"/>
  </g>

  <g transform="translate(900,378)">
    <rect x="-40" y="-4" width="80" height="30" rx="4" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <text x="-8" y="18" font-family="Georgia, serif" font-size="18" fill="#5FA398">Р</text>
  </g>

  <!-- ==================== PARROT (mascot, center-back) ==================== -->
  <g transform="translate(600,150)">
    <!-- perch -->
    <rect x="-4" y="60" width="8" height="130" rx="4" fill="#B67640"/>
    <ellipse cx="0" cy="192" rx="34" ry="8" fill="#4F8F84" opacity="0.35"/>

    <!-- tail -->
    <path d="M-8,50 C-40,70 -55,110 -46,150 C-30,110 -18,80 -4,58 Z" fill="#6E8F94"/>
    <path d="M2,50 C10,90 12,130 4,160 C-2,120 -4,80 -6,58 Z" fill="#87A8AC"/>

    <!-- body -->
    <ellipse cx="0" cy="10" rx="38" ry="46" fill="#8CA9AC"/>
    <ellipse cx="0" cy="18" rx="24" ry="30" fill="#D9C9A8"/>

    <!-- wing -->
    <path d="M20,-10 C48,0 52,40 26,58 C34,32 26,8 8,-6 Z" fill="#6E8F94"/>
    <path d="M22,4 C40,10 42,32 26,44 C30,28 24,14 14,4 Z" fill="#57767A"/>

    <!-- head -->
    <circle cx="-2" cy="-38" r="30" fill="#93AFB1"/>
    <!-- crest -->
    <path d="M-14,-64 C-10,-76 -2,-78 2,-66" stroke="#C98A4B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-2,-66 C2,-80 12,-80 14,-68" stroke="#C98A4B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- eye patch -->
    <circle cx="-14" cy="-40" r="14" fill="#F4EEE0"/>
    <circle cx="-12" cy="-40" r="5" fill="#3B2A22"/>
    <circle cx="-10" cy="-42" r="1.6" fill="#ffffff"/>
    <!-- beak -->
    <path d="M-24,-32 C-40,-30 -42,-18 -30,-12 C-32,-22 -28,-28 -18,-30 Z" fill="#C98A4B"/>
    <path d="M-28,-16 C-36,-14 -36,-8 -28,-6 C-30,-10 -30,-13 -24,-15 Z" fill="#A9702E"/>

    <!-- feet on perch -->
    <path d="M-8,52 L-8,64 M8,52 L8,64" stroke="#C98A4B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- speech bubble from parrot with sound waves -->
  <g transform="translate(690,90)">
    <path d="M0,0 h150 a16,16 0 0 1 16,16 v46 a16,16 0 0 1 -16,16 h-90 l-22,20 4,-20 h-42 a16,16 0 0 1 -16,-16 v-46 a16,16 0 0 1 16,-16 z" fill="#ffffff" stroke="#E3D6C4" stroke-width="2"/>
    <path d="M22,38 q10,-18 20,0 q10,-26 20,0 q10,-18 20,0 q10,-26 20,0 q10,-18 20,0" stroke="#5FA398" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- title text -->
  <g font-family="Georgia, serif" fill="#3B2A22">
    <text x="600" y="470" font-size="30" font-weight="700" text-anchor="middle">Учимся говорить с удовольствием</text>
  </g>
</svg>
